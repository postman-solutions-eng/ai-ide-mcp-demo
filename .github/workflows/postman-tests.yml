name: Postman Collection Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Manual trigger

env:
  POSTMAN_COLLECTION_ID: 30401009-74f1a924-ac42-428e-882a-2724d53fd3a8
  POSTMAN_ENVIRONMENT_ID: 30401009-c5a8cc3e-70dc-4025-adb4-2fa4ac24b9c8

jobs:
  postman-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Run Postman Collection
        run: |
          postman collection run ${{ env.POSTMAN_COLLECTION_ID }} \
            --environment ${{ env.POSTMAN_ENVIRONMENT_ID }}


